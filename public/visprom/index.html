<script>
(function () {
  window.__vispromLoadingActive = false;
  var spinnerTimer = null;

  function stopSpinner() {
    if (spinnerTimer != null) {
      clearInterval(spinnerTimer);
      spinnerTimer = null;
    }
  }

  function startSpinner() {
    stopSpinner();
    var host = document.getElementById('vispromSpinnerHost');
    if (!host) return;
    host.innerHTML = '';
    var ring = document.createElement('div');
    ring.className = 'visprom-loader-spin';
    ring.setAttribute('role', 'presentation');
    host.appendChild(ring);
    var angle = 0;
    spinnerTimer = setInterval(function () {
      if (!window.__vispromLoadingActive) return;
      angle = (angle + 15) % 360;
      ring.style.transform = 'rotate(' + angle + 'deg)';
    }, 40);
  }

  window.vispromSetLoading = function (on) {
    var layer = document.getElementById('appLoadingScreen');
    var shell = document.getElementById('appShell');
    if (on) {
      window.__vispromLoadingActive = true;
      if (layer) layer.style.display = 'flex';
      if (shell) shell.style.display = 'none';
      startSpinner();
    } else {
      window.__vispromLoadingActive = false;
      stopSpinner();
      if (layer) layer.style.display = 'none';
      if (shell) {
        shell.style.display = 'block';
        shell.style.visibility = 'visible';
        shell.style.opacity = '1';
      }
    }
  };

  window.vispromSetLoading(true);
  window.addEventListener('unload', stopSpinner);
})();
</script>

  <script>
  (function () {
    'use strict';
      var defaults = { selections: 10, contourLevels: 8, historySize: 6, favoritesSize: 6 };

    function getSettings() {
      if (!window.__vispromMainChartSettings) {
        window.__vispromMainChartSettings = {
          selections: defaults.selections,
          contourLevels: defaults.contourLevels,
          historySize: defaults.historySize,
          favoritesSize: defaults.favoritesSize
        };
      }
      return window.__vispromMainChartSettings;
    }

    function clampInt(value, min, max) {
      var n = parseInt(value, 10);
      if (!Number.isFinite(n)) return min;
      return Math.max(min, Math.min(max, n));
    }

    function wireSettingsModal() {
      var btn = document.getElementById('mainChartSettingsToggleBtn');
      var overlay = document.getElementById('mainChartSettingsOverlay');
      var panel = document.getElementById('mainChartSettingsPanel');
      var selInput = document.getElementById('mainChartSettingsSelectionsInput');
      var contourInput = document.getElementById('mainChartSettingsContourLevelsInput');
      var historySizeInput = document.getElementById('mainChartSettingsHistorySizeInput');
      var favoritesSizeInput = document.getElementById('mainChartSettingsFavoritesSizeInput');
      var applyBtn = document.getElementById('mainChartSettingsApplyBtn');
      var cancelBtn = document.getElementById('mainChartSettingsCancelBtn');
      if (!btn || !overlay || !panel || !selInput || !contourInput || !historySizeInput || !favoritesSizeInput || !applyBtn || !cancelBtn) return;
      if (btn.__vispromInlineSettingsBound) return;
      btn.__vispromInlineSettingsBound = true;

      var settings = getSettings();
      selInput.value = String(settings.selections);
      contourInput.value = String(settings.contourLevels);
      historySizeInput.value = String(settings.historySize);
      favoritesSizeInput.value = String(settings.favoritesSize);

      function openModal() {
        var s = getSettings();
        selInput.value = String(s.selections);
        contourInput.value = String(s.contourLevels);
        historySizeInput.value = String(s.historySize);
        favoritesSizeInput.value = String(s.favoritesSize);
        overlay.removeAttribute('hidden');
        btn.setAttribute('aria-expanded', 'true');
        setTimeout(function () { selInput.focus(); }, 0);
      }

      function closeModal() {
        overlay.setAttribute('hidden', '');
        btn.setAttribute('aria-expanded', 'false');
      }

      function applySettings() {
        var s = getSettings();
        s.selections = clampInt(selInput.value, 1, 99);
        s.contourLevels = clampInt(contourInput.value, 2, 32);
        s.historySize = clampInt(historySizeInput.value, 1, 50);
        s.favoritesSize = clampInt(favoritesSizeInput.value, 1, 50);
        selInput.value = String(s.selections);
        contourInput.value = String(s.contourLevels);
        historySizeInput.value = String(s.historySize);
        favoritesSizeInput.value = String(s.favoritesSize);
        if (typeof window.__vispromApplyMainChartSettings === 'function') {
          window.__vispromApplyMainChartSettings(s.selections, s.contourLevels);
        }
        window.dispatchEvent(new CustomEvent('visprom-main-chart-settings', { detail: s }));
        closeModal();
      }

      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        openModal();
      });
      cancelBtn.addEventListener('click', function (e) {
        e.preventDefault();
        closeModal();
      });
      applyBtn.addEventListener('click', function (e) {
        e.preventDefault();
        applySettings();
      });
      panel.addEventListener('click', function (e) { e.stopPropagation(); });
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e && e.key === 'Escape' && !overlay.hasAttribute('hidden')) closeModal();
      });
      selInput.addEventListener('keydown', function (e) {
        if (e && e.key === 'Enter') applySettings();
      });
      contourInput.addEventListener('keydown', function (e) {
        if (e && e.key === 'Enter') applySettings();
      });

      window.__vispromSettingsModalReady = true;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wireSettingsModal);
    } else {
      wireSettingsModal();
    }
  })();
  </script>

.splom .tooltip { box-sizing: border-box; overflow: visible !important; position: relative; }
.splom .splom-cell {
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
  border: 1px solid #d1d5db;
  border-radius: 2px;
  transition: border-color 120ms ease, border-width 120ms ease, background-color 120ms ease, box-shadow 120ms ease, outline-color 120ms ease;
}
.splom .splom-cell::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: var(--splom-heat-overlay, transparent);
  opacity: 1;
  z-index: 2;
}
.splom .splom-cell.active-splom-cell {
  z-index: 8;
  overflow: visible;
  border-color: transparent !important;
  border-width: 1px !important;
  outline: none;
  box-shadow: none;
}
.splom .splom-cell.active-splom-cell::after {
  opacity: 1;
}
.splom .splom-cell.active-splom-cell::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 11;
  border-radius: 2px;
  animation: splom-active-heartbeat 1.65s ease-in-out infinite;
  box-shadow:
    inset 0 0 0 var(--splom-active-stroke-base, 3px) #111,
    0 0 0 var(--splom-active-stroke-glow1, 2px) rgba(17, 17, 17, 0.28);
}
@keyframes splom-active-heartbeat {
  0%, 100% {
    box-shadow:
      inset 0 0 0 var(--splom-active-stroke-min, 2px) #111,
      0 0 0 var(--splom-active-stroke-glow1, 2px) rgba(17, 17, 17, 0.2);
    opacity: 1;
  }
  12% {
    box-shadow:
      inset 0 0 0 var(--splom-active-stroke-pulse1, 5px) #111,
      0 0 0 var(--splom-active-stroke-glow2, 4px) rgba(17, 17, 17, 0.35);
    opacity: 1;
  }
  24% {
    box-shadow:
      inset 0 0 0 var(--splom-active-stroke-min, 2px) #111,
      0 0 0 var(--splom-active-stroke-glow1, 2px) rgba(17, 17, 17, 0.18);
    opacity: 0.92;
  }
  36% {
    box-shadow:
      inset 0 0 0 var(--splom-active-stroke-pulse2, 4px) #111,
      0 0 0 var(--splom-active-stroke-glow2, 5px) rgba(17, 17, 17, 0.28);
    opacity: 1;
  }
  52%, 100% {
    box-shadow:
      inset 0 0 0 var(--splom-active-stroke-min, 2px) #111,
      0 0 0 var(--splom-active-stroke-glow1, 2px) rgba(17, 17, 17, 0.2);
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .splom .splom-cell.active-splom-cell::before {
    animation: none;
    box-shadow:
      inset 0 0 0 var(--splom-active-stroke-base, 3px) #111,
      0 0 0 var(--splom-active-stroke-glow1, 2px) rgba(17, 17, 17, 0.25);
  }
}
.splom .splom-cell.splom-cell-hovered:not(.active-splom-cell)::before,
.splom .splom-cell.splom-cell-matching-pair:not(.active-splom-cell)::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

<script>
(function () {
  const sectionBar = document.getElementById("sectionBar");
  const resetPanelsBtn = document.getElementById("resetPanelsBtn");
  const topRow = document.querySelector(".top-row");
  const bottomRow = document.querySelector(".bottom-row");
  const topWrap = document.querySelector(".top-row-wrap");
  const bottomWrap = document.querySelector(".bottom-row-wrap");
  const handleMainBottom = document.querySelector('[data-handle="main-bottom"]');

  const topPanels = [
    document.querySelector('[data-panel="panel-data"]'),
    document.querySelector('[data-panel="panel-splom"]'),
    document.querySelector('[data-panel="panel-main"]')
  ];
  const bottomPanels = [
    document.querySelector('[data-panel="panel-selection"]'),
    document.querySelector('[data-panel="panel-history"]')
  ];

  const state = {
    topSizes: [24, 46, 30],
    bottomSizes: [70, 30],
    topHeight: 70
  };

  const COLLAPSED = 14;
  const MIN_SIZE = 10;
  let resizeNotifyScheduled = false;
  let cancelActiveDrag = null;

  function notifyChartsResize() {
    if (resizeNotifyScheduled) return;
    resizeNotifyScheduled = true;
    requestAnimationFrame(() => {
      resizeNotifyScheduled = false;
      window.dispatchEvent(new Event("resize"));
    });
  }

  function setPanelToggleButtons() {
    sectionBar.querySelectorAll("button[data-panel-toggle]").forEach((btn) => {
      const name = btn.getAttribute("data-panel-toggle");
      const panel = document.querySelector('[data-panel="' + name + '"]');
      if (!panel) return;
      const hidden = panel.classList.contains("panel-hidden");
      btn.classList.toggle("active-layout", !hidden);
      btn.setAttribute("aria-pressed", (!hidden).toString());
    });
  }

  function normalize(arr, indices) {
    const sum = indices.reduce((a, i) => a + arr[i], 0);
    if (sum <= 0) {
      const even = 100 / indices.length;
      indices.forEach((i) => (arr[i] = even));
      return;
    }
    indices.forEach((i) => (arr[i] = (arr[i] / sum) * 100));
  }

  function visibleIndices(panels) {
    const out = [];
    panels.forEach((p, i) => {
      if (!p.classList.contains("panel-hidden")) out.push(i);
    });
    return out;
  }

  function countVisiblePanels(panels) {
    return visibleIndices(panels).length;
  }

  function applyRowSizes(rowEl, panels, sizes, skipNormalize) {
    if (!rowEl) return;
    const vis = visibleIndices(panels);
    if (!vis.length) {
      rowEl.style.display = "none";
      return;
    }
    rowEl.style.display = "flex";
    if (!skipNormalize) {
      normalize(sizes, vis);
    }
    panels.forEach((panel, i) => {
      if (panel.classList.contains("panel-hidden")) {
        panel.style.display = "none";
        panel.style.flex = "";
        return;
      }
      panel.style.display = "flex";
      const collapsed = panel.classList.contains("panel-collapsed");
      if (collapsed) {
        panel.style.flex = "0 0 " + COLLAPSED + "px";
      } else {
        panel.style.flex = "1 1 " + sizes[i] + "%";
      }
    });
  }

  function applyLayout(skipNormalize) {
    const topVisible = countVisiblePanels(topPanels);
    const bottomVisible = countVisiblePanels(bottomPanels);

    if (topVisible === 0) {
      topWrap.style.display = "none";
      topWrap.style.flex = "0 0 0";
      handleMainBottom.style.display = bottomVisible > 0 ? "block" : "none";
      bottomWrap.style.flex = "1 1 auto";
    } else {
      topWrap.style.display = "flex";
      topWrap.style.flex = "0 0 " + state.topHeight + "%";
      handleMainBottom.style.display = bottomVisible > 0 ? "block" : "none";
      bottomWrap.style.flex = "1 1 auto";
      applyRowSizes(topRow, topPanels, state.topSizes, skipNormalize);
    }

    if (bottomVisible === 0) {
      bottomWrap.style.display = "none";
      bottomWrap.style.flex = "0 0 0";
      if (topVisible > 0) {
        topWrap.style.flex = "1 1 auto";
        handleMainBottom.style.display = "none";
      }
    } else {
      bottomWrap.style.display = "flex";
      applyRowSizes(bottomRow, bottomPanels, state.bottomSizes, skipNormalize);
    }

    setHandleVisibility();
    setPanelToggleButtons();
  }

  function setHandleVisibility() {
    const [d, s, m] = topPanels;
    const [sel, his] = bottomPanels;
    document.querySelector('[data-handle="top-data-splom"]').style.display =
      (!d.classList.contains("panel-hidden") && !s.classList.contains("panel-hidden")) ? "block" : "none";
    document.querySelector('[data-handle="top-splom-main"]').style.display =
      (!s.classList.contains("panel-hidden") && !m.classList.contains("panel-hidden")) ? "block" : "none";
    document.querySelector('[data-handle="bottom-selection-history"]').style.display =
      (!sel.classList.contains("panel-hidden") && !his.classList.contains("panel-hidden")) ? "block" : "none";
  }

  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  function dragBetween(rowEl, panels, sizes, leftIndex, rightIndex, isVerticalHandle, eStart, onDone) {
    if (cancelActiveDrag) {
      cancelActiveDrag();
      cancelActiveDrag = null;
    }
    if (panels[leftIndex].classList.contains("panel-hidden") || panels[rightIndex].classList.contains("panel-hidden")) return;
    const leftRect = panels[leftIndex].getBoundingClientRect();
    const rightRect = panels[rightIndex].getBoundingClientRect();
    let leftPx = isVerticalHandle ? leftRect.width : leftRect.height;
    let rightPx = isVerticalHandle ? rightRect.width : rightRect.height;
    const pairTotal = Math.max(1, leftPx + rightPx);
    const pairPctTotal = Math.max(1, sizes[leftIndex] + sizes[rightIndex]);
    const minPx = COLLAPSED;
    let last = isVerticalHandle ? eStart.clientX : eStart.clientY;

    function move(ev) {
      const now = isVerticalHandle ? ev.clientX : ev.clientY;
      const delta = now - last;
      last = now;
      leftPx = clamp(leftPx + delta, minPx, pairTotal - minPx);
      rightPx = pairTotal - leftPx;
      const leftRatio = leftPx / pairTotal;
      sizes[leftIndex] = pairPctTotal * leftRatio;
      sizes[rightIndex] = pairPctTotal * (1 - leftRatio);
      applyLayout(true);
    }
    function up() {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      if (cancelActiveDrag === up) cancelActiveDrag = null;
      applyLayout(false);
      notifyChartsResize();
      if (onDone) onDone();
    }
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    cancelActiveDrag = up;
  }

  function attachHandle(selector, rowEl, panels, sizes, leftIndex, rightIndex, vertical) {
    const h = document.querySelector(selector);
    h.addEventListener("mousedown", function (e) {
      e.preventDefault();
      h.classList.add("dragging");
      dragBetween(rowEl, panels, sizes, leftIndex, rightIndex, vertical, e, function () {
        h.classList.remove("dragging");
      });
    });
  }

  attachHandle('[data-handle="top-data-splom"]', topRow, topPanels, state.topSizes, 0, 1, true);
  attachHandle('[data-handle="top-splom-main"]', topRow, topPanels, state.topSizes, 1, 2, true);
  attachHandle('[data-handle="bottom-selection-history"]', bottomRow, bottomPanels, state.bottomSizes, 0, 1, true);

  handleMainBottom.addEventListener("mousedown", function (e) {
    if (cancelActiveDrag) {
      cancelActiveDrag();
      cancelActiveDrag = null;
    }
    e.preventDefault();
    handleMainBottom.classList.add("dragging");
    const rect = document.querySelector(".grid-container").getBoundingClientRect();
    let topPx = topWrap.getBoundingClientRect().height;
    let bottomPx = bottomWrap.getBoundingClientRect().height;
    let lastY = e.clientY;
    const minPx = 60;
    function move(ev) {
      const dy = ev.clientY - lastY;
      lastY = ev.clientY;
      topPx = clamp(topPx + dy, minPx, rect.height - minPx);
      bottomPx = clamp(bottomPx - dy, minPx, rect.height - minPx);
      state.topHeight = (topPx / rect.height) * 100;
      applyLayout();
    }
    function up() {
      handleMainBottom.classList.remove("dragging");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      if (cancelActiveDrag === up) cancelActiveDrag = null;
      notifyChartsResize();
    }
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    cancelActiveDrag = up;
  });

  function togglePanel(name) {
    const panel = document.querySelector('[data-panel="' + name + '"]');
    if (!panel) return;
    panel.classList.toggle("panel-hidden");
    panel.classList.remove("panel-collapsed");
    applyLayout();
    notifyChartsResize();
  }

  function resetPanelStyles() {
    [...topPanels, ...bottomPanels].forEach((p) => {
      p.classList.remove("panel-hidden", "panel-collapsed");
      p.style.display = "";
      p.style.flex = "";
    });
    topWrap.style.display = "";
    topWrap.style.flex = "";
    bottomWrap.style.display = "";
    bottomWrap.style.flex = "";
    if (topRow) {
      topRow.style.display = "";
    }
    if (bottomRow) {
      bottomRow.style.display = "";
    }
  }

  sectionBar.addEventListener("click", function (e) {
    const btn = e.target.closest("button");
    if (!btn) return;
    const panelName = btn.getAttribute("data-panel-toggle");
    if (panelName) togglePanel(panelName);
    if (btn === resetPanelsBtn) {
      if (cancelActiveDrag) {
        cancelActiveDrag();
        cancelActiveDrag = null;
      }
      resetPanelStyles();
      state.topSizes.splice(0, state.topSizes.length, 24, 46, 30);
      state.bottomSizes.splice(0, state.bottomSizes.length, 70, 30);
      state.topHeight = 70;
      applyLayout();
      notifyChartsResize();
    }
  });

  applyLayout();
  setPanelToggleButtons();
  window.addEventListener("resize", function () {
    applyLayout();
  });
})();
</script>
